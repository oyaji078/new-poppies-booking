services:
  - type: web
    name: new-poppies-booking
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: New Poppies Senggigi
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Makassar
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: new-poppies-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log
      - key: DOKU_ENVIRONMENT
        value: sandbox
      - key: DOKU_SANDBOX_CLIENT_ID
        sync: false
      - key: DOKU_SANDBOX_SECRET_KEY
        sync: false
      - key: DOKU_PRODUCTION_CLIENT_ID
        sync: false
      - key: DOKU_PRODUCTION_SECRET_KEY
        sync: false
      - key: DOKU_PAYMENT_METHODS
        value: QRIS
      - key: HOTEL_CURRENCY
        value: IDR

databases:
  - name: new-poppies-db
    plan: free
    databaseName: new_poppies_booking
    user: new_poppies_app
